services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - crm_pg_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: "8000"
      API_ENV: ${API_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      Q2_HELIX_API_URL: ${Q2_HELIX_API_URL:-https://sandbox-api.helix.q2.com}
      Q2_HELIX_API_KEY: ${Q2_HELIX_API_KEY:-}
      Q2_HELIX_API_SECRET: ${Q2_HELIX_API_SECRET:-}
      Q2_HELIX_PROGRAM_ID: ${Q2_HELIX_PROGRAM_ID:-}
      Q2_ENVIRONMENT: ${Q2_ENVIRONMENT:-sandbox}
      Q2_DEFAULT_PRODUCT_ID: ${Q2_DEFAULT_PRODUCT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api

volumes:
  crm_pg_data:
